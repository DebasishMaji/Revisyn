name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python "${{ matrix.python }}"
      - name: Verify the matrix interpreter
        run: |
          uv run python -c \
            "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON']"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python examples/memory_retraction.py
      - run: uv build
      - name: Exercise the installed wheel outside the checkout
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/revisyn-wheel"
          uv pip install --python "$RUNNER_TEMP/revisyn-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" --version
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" lab > "$RUNNER_TEMP/revisyn-lab.json"
          "$RUNNER_TEMP/revisyn-wheel/bin/python" \
            "$GITHUB_WORKSPACE/examples/memory_retraction.py" \
            --directory "$RUNNER_TEMP/revisyn-demo"
