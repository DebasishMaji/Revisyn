name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra langgraph --python "${{ matrix.python }}"
      - name: Verify the matrix interpreter
        run: |
          uv run --locked --extra langgraph python -c \
            "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON']"
      - run: uv run --locked --extra langgraph ruff check .
      - run: uv run --locked --extra langgraph ruff format --check .
      - run: uv run --locked --extra langgraph mypy
      - run: uv run --locked --extra langgraph pytest
      - run: uv run --locked --extra langgraph python examples/memory_retraction.py
      - run: uv run --locked --extra langgraph python examples/langgraph_memory.py
      - run: uv build
      - name: Exercise the installed wheel outside the checkout
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/revisyn-wheel"
          uv pip install --python "$RUNNER_TEMP/revisyn-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/revisyn-wheel/bin/python" -c \
            "import revisyn, importlib.util; assert importlib.util.find_spec('langgraph') is None"
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" --version
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" lab > "$RUNNER_TEMP/revisyn-lab.json"
          "$RUNNER_TEMP/revisyn-wheel/bin/python" \
            "$GITHUB_WORKSPACE/examples/memory_retraction.py" \
            --directory "$RUNNER_TEMP/revisyn-demo"
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" status "$RUNNER_TEMP/revisyn-demo/memory.sqlite3" \
            --namespace orders
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" snapshot "$RUNNER_TEMP/revisyn-demo/memory.sqlite3" \
            --out "$RUNNER_TEMP/revisyn-snapshot.sqlite3"
          "$RUNNER_TEMP/revisyn-wheel/bin/revisyn" list "$RUNNER_TEMP/revisyn-snapshot.sqlite3" \
            --namespace orders --limit 1
          "$RUNNER_TEMP/revisyn-wheel/bin/python" - "$RUNNER_TEMP/revisyn-snapshot.sqlite3" <<'PY'
          import sys
          from revisyn import MemoryStore, SnapshotUsageError
          try:
              with MemoryStore(sys.argv[1], namespace="orders", require_existing=True):
                  raise AssertionError("An inspection snapshot was accepted as live state.")
          except SnapshotUsageError:
              pass
          PY
      - name: Exercise the optional integration from the installed wheel
        run: |
          uv export --locked --extra langgraph --no-dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/revisyn-integration-constraints.txt"
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            uv pip install --python "$RUNNER_TEMP/revisyn-wheel/bin/python" \
              --constraint "$RUNNER_TEMP/revisyn-integration-constraints.txt" "${wheel}[langgraph]"
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/revisyn-wheel/bin/python" \
            "$GITHUB_WORKSPACE/examples/langgraph_memory.py"
